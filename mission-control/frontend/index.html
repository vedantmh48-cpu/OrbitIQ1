<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06090f" />
  <title>Mission Control · SatQuery AI</title>

  <!-- Typography (fallback stack in css/reset.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheet architecture: reset → tokens → base → components → dashboard -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body>
  <div class="app" id="app">
    <!-- ============================ Sidebar ============================ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="var(--accent)" stroke-width="1.2" opacity="0.7" />
            <circle cx="12" cy="12" r="3.4" fill="var(--accent)" />
            <path d="M12 2v20M2 12h20" stroke="rgba(56,189,248,0.35)" stroke-width="0.8" opacity="0.7" />
          </svg>
        </span>
        <div class="brand-text">
          <strong>MISSION CONTROL</strong>
          <span>SatQuery AI · Ground Segment</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Console sections">
        <p class="nav-label">Console</p>
        <a class="nav-link is-active" href="#/overview" data-view="overview">Overview</a>
        <a class="nav-link" href="#/missions" data-view="missions">Missions</a>
        <a class="nav-link" href="#/fleet" data-view="fleet">Fleet</a>
        <a class="nav-link" href="#/telemetry" data-view="telemetry">Telemetry</a>
        <a class="nav-link" href="#/alerts" data-view="alerts">
          Alerts
          <span class="nav-badge" id="nav-alerts-badge" hidden></span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-link">
          <span class="dot dot--ok" aria-hidden="true"></span>
          <span>All systems nominal</span>
        </div>
        <div class="foot-meta">
          <span>MC v1.0.0</span>
          <span id="foot-version">· API…</span>
        </div>
      </div>
    </aside>

<!-- ============================ Main column ======================== -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
            <path d="M3 4h14M3 10h14M3 16h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>

        <div class="topbar-title">
          <h1 id="view-title">Overview</h1>
          <p id="view-subtitle">Mission Control · Global fleet &amp; environmental telemetry</p>
        </div>

        <div class="topbar-right">
          <label class="search-box" id="global-search">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="3.4" stroke="currentColor" stroke-width="1.4" />
              <path d="M11 3l3 8v3" stroke="currentColor" stroke-width="1.4" fill="none" />
            </svg>
            <input id="search-input" type="search" placeholder="Search fleet, missions…" autocomplete="off" />
            <kbd>Ctrl K</kbd>
          </label>

          <div class="utc-clock">
            <span class="clock-mono" id="utc-clock">--:--:--</span>
            <span class="clock-sub" id="utc-date">—— · —— ——</span>
          </div>

          <span class="status-pill" id="status-pill">
            <span class="dot dot--ok" aria-hidden="true"></span>
            <span>Nominal</span>
          </span>

          <a class="icon-btn has-badge" href="#/alerts" aria-label="Open alerts" title="Open alerts">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
              <path d="M4 5a5 3.6 0 0 1 12 5a5 3.6 0 0 1 20 5" stroke="currentColor" stroke-width="1.5" fill="none" />
              <circle cx="10" cy="12" r="3.5" fill="currentColor" opacity="0.85" />
            </svg>
            <span class="badge-dot" id="bell-count" hidden>0</span>
          </a>

          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none" id="theme-icon-sun" hidden>
              <circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.6" />
              <path d="M4 10h4M9 10h4M4 10v4M9 15h4" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none" id="theme-icon-moon">
              <path d="M14 4a6 5.4 0 0 1 2 15" stroke="currentColor" stroke-width="1.7" fill="none" />
              <circle cx="4" cy="13" r="1.2" fill="currentColor" />
              <circle cx="7" cy="5" r="1" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <main class="view" id="view" aria-live="polite">
        <!-- Rendered by js/views/*.js -->
      </main>

      <footer class="view-foot">
        <span id="foot-stats">—</span>
        <span>REST · mission-control/backend</span>
      </footer>
    </div>
  </div>

  <!-- Modal + toast surfaces -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modal">
      <div class="modal-inner" id="modal-inner"></div>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="js/api.js" defer></script>
  <script src="js/views/overview.js" defer></script>
  <script src="js/views/missions.js" defer></script>
  <script src="js/views/fleet.js" defer></script>
  <script src="js/views/telemetry.js" defer></script>
  <script src="js/views/alerts.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
